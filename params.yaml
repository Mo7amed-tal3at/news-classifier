data:
  categories:
    - technology
    - business
    - sports
    - politics
    - health
  weekly_articles_per_category: 100

preprocessing:
  max_features: 50000
  ngram_range: [1, 2]
  min_df: 2

training:
  test_size: 0.2
  random_state: 42
  cv_folds: 5

drift:
  ks_pvalue_threshold: 0.05
  psi_threshold: 0.2
